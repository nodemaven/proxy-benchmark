# Template. Copy to `<provider-id>.toml` and fill in. The file name is what
# `--providers` takes and what the credential variables are derived from, so
# `oxylabs.toml` is selected as `--providers oxylabs` and reads OXYLABS_LOGIN,
# OXYLABS_PASSWORD, OXYLABS_HOST and OXYLABS_PORT from the environment.
#
# Nothing in this file is a secret and none of it should be: credentials are
# read from the environment in config.py and nowhere else.
#
# Files beginning with `_` are templates and are not offered as providers.

label = "Human readable name, used in console output"

# "measured" or "documented", and this is the field a reader checks first.
#
# Say "documented" until rows exist. It means the dialect below was read off the
# vendor's own documentation and nobody has sent a byte through it from here, so
# a mistake in it is still possible - and a mistake here is invisible, because at
# least one gateway answers an unrecognised parameter name with 200 and the
# setting quietly dropped. The connection succeeds and the row describes settings
# that were never applied.
#
# Promote it to "measured" in the same commit that adds the first run to
# data/runs/, and not before.
status = "documented"
source = "URL of the vendor page this was read from"
source_read = "YYYY-MM-DD"

# How a setting is spelled inside the proxy username. Most gateways take
#     <prefix><separator><key><pair_separator><value><separator>...
# which for `prefix = "{login}"`, both separators `-` gives
#     acct-country-us-sid-abc123
# and for `prefix = "customer-{login}"`, separator `-`, pair_separator `-` gives
#     customer-acct-cc-us-sessid-abc123
# once `aliases` renames the parameters.
prefix = "{login}"
separator = "-"
pair_separator = "-"

# Only "username" is implemented. A gateway that takes its settings another way -
# one port per country, or a control API called before the request - needs code
# rather than a config entry, and building a username for it would send the
# settings nowhere.
param_transport = "username"

# Parameters this gateway recognises, written in this harness's vocabulary
# rather than the vendor's: `country`, `region`, `city`, `isp`, `sid`, `ttl`.
# Anything outside the list is refused before a request is built.
#
# List only what the vendor documents. A parameter left out costs an error
# message; a parameter wrongly included costs a run whose rows claim a setting
# the gateway ignored, and that one cannot be found afterwards.
known_params = ["country", "sid"]

# The vendor's own spelling, keyed by the canonical name. Omit an entry when the
# two agree. `country = "cc"` produces `cc-us` from `--countries us`.
[aliases]
# country = "cc"
# sid = "sessid"

# Which canonical parameter pins a sticky session. It must appear in
# known_params: a session is how every probe in this repository holds one exit
# across a series of queries, so a provider whose session parameter is missing
# cannot run the method at all.
session_param = "sid"

# Documented gateway address. <ID>_HOST and <ID>_PORT override these, so the
# entry is a default and a piece of documentation rather than a setting.
host = ""
port = 0

# Header carrying the exit address on the CONNECT reply, when the gateway sends
# one. Leave empty and the exit address costs an echo request through the session
# instead - about 330 bytes, and worth knowing before pricing a run.
exit_ip_header = ""

notes = """
Anything a reader needs and the vendor does not say. What the gateway answers to
a bad country, to a bad session id and to a parameter name it does not know;
whether the sticky key is the session id alone or the whole parameter set;
whether the default country is stable. Those three cost an afternoon of probing
each and none of them is documented anywhere.

`python -m nmbench gateway-health --provider <id>` is the cheapest way to find
out, and it sends a handful of CONNECTs and no target traffic. Point it at a new
definition before a matrix: it is the only check that can tell a wrong username
format from a wrong password, because the gateway itself cannot.
"""
