# NodeMaven. The only definition here anyone has run: every row in data/runs/
# was produced through this gateway.
label = "NodeMaven"
# Measured, not transcribed. The matrix sends no `type`, so every row is the
# gateway's default, and 5 echo requests on the unset arm drew Comcast,
# Charter and the other consumer ASNs recorded in the notes below - which is
# what `type=residential` drew too.
network = "residential"
status = "measured"
source = "dashboard proxy generator, plus raw CONNECT probes recorded in data/runs/"
source_read = "2026-08-12"

# `<login>-country-us-sid-abc123-ttl-10m`
prefix = "{login}"
separator = "-"
pair_separator = "-"
session_param = "sid"
param_transport = "username"

# Documented defaults. NODEMAVEN_HOST and NODEMAVEN_PORT override them, and the
# credentials are never in this file.
host = "gate.nodemaven.com"
port = 8080

# Returned on the CONNECT reply, so an exit address costs one handshake and no
# target traffic. Not guaranteed: replies reading `Connection established`
# carried it and replies reading `OK` carried none, with no exception either way
# over 17 tunnels, so there is more than one implementation behind the name and
# a caller has to handle its absence rather than latch on the first miss.
#
# THERE ARE THREE PHRASES, NOT TWO, measured 2026-09-10 over 100 CONNECTs in one
# 19-minute window, run `gateway_health_20260910T150151Z`: `OK` 52,
# `Connection established` 44, and `Connection Established` 4 - a third spelling
# differing from the second by one capital letter. Oxylabs, Decodo and Bright
# Data each answered all 100 of their own attempts with exactly one string, so
# this is ours and not what a CONNECT proxy normally does. It matters because
# `connect_reactions` below keys a diagnosis on the phrase: three spellings of
# one outcome means a client keying on it is keying on which node answered, and
# a `==` against `Connection established` misses 4% of that arm outright.
#
# WHAT THE RUN COULD NOT CHECK, and the reason is a gap in our own rows. Whether
# the phrase still predicts the header is unanswerable from
# `data/runs/*.jsonl`, because a row records `exit_ip` and not where it came
# from - `gateway.py` falls back to an echo request after `_HEADER_GIVE_UP`
# misses, so 99 of 100 exits being named says nothing about how many arrived
# free. The 17-tunnel correlation above therefore stands unre-tested rather than
# confirmed, and re-testing it needs a field on the row saying which instrument
# produced the address.
exit_ip_header = "X-Proxy-Exit-IP"

# Confirmed to be recognised. Anything outside this set is refused client-side,
# because the gateway answers an unknown name with 200 and the setting silently
# dropped - the connection succeeds with settings that were never applied, which
# is the one failure that cannot be seen in the rows afterwards.
#
# `speed` was missing until 2026-08-12 and was found by reading the provider's
# own proxy generator rather than by probing: the dashboard offers four IP filter
# modes and builds three of them out of `filter` and `speed` together, while the
# fourth passes neither. A name we do not know is indistinguishable from a name
# the gateway does not know, so the generator was the only place it could surface.
#
# `type` was missing until 2026-08-26 and is the expensive one. It selects mobile
# against residential exits, which is a different pool and not a filter over the
# same one, and no row in data/runs/ can ever have asked for it - strict
# validation refused the name before a request existed. It surfaced by reading
# the vendor's own public SDK at `nodemavencom/proxy`, which neither of ours
# matches, and was then verified two ways rather than assumed from it.
known_params = ["country", "region", "city", "isp", "sid", "ttl", "filter",
                "ipv4", "speed", "type"]

# This gateway takes the literal string `any` as "do not pin a country", which
# is why the harness's country axis has a keyword of that name at all - the
# keyword was this vendor's wire value promoted into the runner without anyone
# noticing it was one. Oxylabs, Decodo and Bright Data have no such spelling and
# their definitions name none, so an unpinned cell sends them no country
# parameter at all.
#
# Worth keeping rather than dropping in favour of simply omitting `country`
# here too: the `notes` below record that with no `country` the default country
# is not stable, so the two are different requests on this gateway and only one
# of them is the one 130 rows on disk were measured through.
country_any = "any"

notes = """
Measured 2026-08-10 by raw CONNECT probes. None of this is documented by the
vendor; re-verify before quoting it.

Sticky sessions key on the whole recognised parameter set, not on `sid` alone.
`country=us, sid=A` and `country=us, sid=A, filter=medium` are two different
sessions, `ttl` does not participate and `filter` does. Adding or removing any
parameter silently moves you to another exit.

Seven inputs, seven reactions, none of which names the cause:
  bad country          406 Not Acceptable
  bad region           406 Not Acceptable
  bad city             500 Internal Server Error
  bad filter value     407 Proxy Authentication Required
  bad ttl value        407 Proxy Authentication Required
  empty value          no reply, the connection hangs about 20 s
  unknown parameter    200, the parameter is ignored

The 407 cases are actively misleading - they send the operator to check
credentials. With no `country` the default country is not stable.

Re-probed 2026-08-26 from the VPS to settle which names the gateway knows,
because four sources disagreed: this file, our Python SDK, the vendor's public
SDK at `nodemavencom/proxy`, and the help pages. Acceptance proves nothing here,
so every phase carried a negative control - `zzqqx`, a name nobody implemented -
and a positive one, `filter`, known recognised since 2026-08-10.

  name          junk value   reading
  zzqqx           200        the control: unknown names answer 200 for anything
  filter          407        the control: known names refuse what is not on the list
  type            407        recognised - an unknown name cannot produce this
  speed           407        recognised, confirming the 2026-08-12 generator read
  norotate        200        indistinguishable from the unknown name

`type` selects the network and not merely a label on it. 5 echo requests per arm,
fresh sid each, country=us: `type=mobile` drew AS21928 T-Mobile three times, one
AS6167 - that is Cellco, the wireless side of Verizon, whatever ipinfo labels it -
and one AS7018. `type=residential` and the unset arm drew Comcast, Charter,
Windstream, Metronet, Fidium, Planet and AS701 Verizon wireline, and no mobile
ASN between them. So the parameter moves you to a carrier pool, which is a
different set of addresses rather than a quality filter over the same one.

`filter=high` and `filter=low` both answer 200 and are therefore on the
whitelist, against a junk filter value answering 407. Every run in data/runs/
used `filter=medium` and nothing here has ever measured the other two.

**`ttl` is documented wrong and fails misleadingly.** The help pages give TTL in
seconds; `ttl=60` is refused 407 and `ttl=1m` is accepted. Both SDKs emit
`60s / 1m / 1h / 24h` and they are right. An operator following the documentation
gets a 407 and goes to check credentials that are fine.

**`norotate` is not recognised on this account and this gateway.** Three
independent probes: junk value answers 200 exactly like the unknown name; with no
sid it rotated 6 distinct exits of 6, as did both controls; with a fixed sid and
`ttl=1m` sampled at 0, 78 and 157 seconds it drew 3 distinct of 3, as did both
controls. Our own SDK ships it as a valid parameter, so a user setting it gets a
200 and no rotation change. That is measured against `gate.nodemaven.com:8080` on
one account on 2026-08-26 and does not rule out the name being real on another
product or plan - a name the gateway does not know is invisible by design, so
this is the strongest negative the method can produce and it is not a proof.
"""

# The tunable settings, as data rather than as prose. Everything below was
# already written in `notes` above; what is new is that a form can read it.
#
# These blocks are at the end of the file and have to stay there. A TOML table
# header captures every bare key that follows it, so a `[params.x]` block placed
# above `notes` would silently make `notes` a field of that block and drop it
# from the definition.
#
# Nothing here is a value somebody thought was plausible. Where the notes record
# the value being sent and something observed, it is `measured`; where they
# record only that the gateway refused to refuse it, it is `accepted`; where the
# name came off a vendor surface and the legal values were never written down,
# the block says so and offers no list at all. That last case is the one worth
# being strict about - a dropdown of invented values is worse than no dropdown,
# because this gateway answers an unrecognised setting with 200 and drops it,
# and an hour of runtime then reports on a setting that was never applied.
[params.filter]
label = "IP quality filter"
kind = "enum"
measured = ["medium"]
accepted = ["low", "high"]
help = """\
medium is the only one with rows behind it: every run in data/runs/ used it. \
low and high answer 200 where a junk value answers 407, which puts them on the \
gateway's whitelist and says nothing about what they do. Note that changing it \
also moves you to a different sticky session - sessions key on the whole \
parameter set, and filter participates where ttl does not."""

[params.type]
label = "Network type"
kind = "enum"
measured = ["mobile", "residential"]
help = """\
Measured 2026-08-26, 5 echo requests per arm, fresh sid, country=us. mobile \
drew T-Mobile, Cellco and AS7018; residential and the unset arm drew Comcast, \
Charter, Windstream and other wireline ASNs with no mobile among them. So this \
selects a different pool rather than filtering the same one, and a mobile arm \
is not comparable with a residential one. No row in data/runs/ has ever asked \
for it - strict validation refused the name until 2026-08-26."""

[params.ttl]
label = "Sticky session TTL"
kind = "text"
placeholder = "10m"
accepted = ["1m"]
documented = ["60s", "1h", "24h"]
help = """\
Needs a unit. The vendor's help pages give TTL in seconds and they are wrong in \
a way that costs an hour: ttl=60 is refused 407, which sends the operator off to \
check credentials that are fine, while ttl=1m is accepted. Both SDKs emit the \
unit form. Only 1m has actually been sent from here."""

[params.region]
label = "Region"
kind = "text"
placeholder = "california"
help = """\
A bare name on this gateway - california, not us_california and not ca. Three \
other providers here spell the same thing three other ways, which is why the \
name is not shared. A value it does not recognise answers 406. The legal set is \
not enumerated anywhere here, so this is a text box and a wrong value costs the \
cell."""

[params.city]
label = "City"
kind = "text"
placeholder = "chicago"
help = """\
A value the gateway does not recognise answers 500, which reads like a fault on \
their side rather than as a rejected input. Not enumerated here."""

[params.isp]
label = "ISP"
kind = "text"
help = """\
A recognised name, never sent from here, and no legal value written down \
anywhere in this file. Find out what it takes before spending a run on it."""

[params.speed]
label = "Speed class"
kind = "text"
help = """\
THE LEGAL VALUES ARE NOT WRITTEN DOWN. The name is recognised - it answers 407 \
to a junk value where an unknown name answers 200 - and it was found by reading \
the vendor's own dashboard generator, which builds three of its four IP filter \
modes out of filter and speed together. Which values it builds them from was \
never recorded. So anything typed here is a guess, and a guess this gateway \
does not recognise is answered 200 and dropped."""

[params.ipv4]
label = "IPv4 only"
kind = "text"
help = """\
Listed as recognised and never probed from here. No legal value is written \
down, not even whether it takes true/false or 1/0."""
