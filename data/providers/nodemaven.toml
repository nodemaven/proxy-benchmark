# NodeMaven. The only definition here anyone has run: every row in data/runs/
# was produced through this gateway.
label = "NodeMaven"
status = "measured"
source = "dashboard proxy generator, plus raw CONNECT probes recorded in data/runs/"
source_read = "2026-08-12"

# `<login>-country-us-sid-abc123-ttl-10m`
prefix = "{login}"
separator = "-"
pair_separator = "-"
session_param = "sid"
param_transport = "username"

# Documented defaults. NODEMAVEN_HOST and NODEMAVEN_PORT override them, and the
# credentials are never in this file.
host = "gate.nodemaven.com"
port = 8080

# Returned on the CONNECT reply, so an exit address costs one handshake and no
# target traffic. Not guaranteed: replies reading `Connection established`
# carried it and replies reading `OK` carried none, with no exception either way
# over 17 tunnels, so there is more than one implementation behind the name and
# a caller has to handle its absence rather than latch on the first miss.
exit_ip_header = "X-Proxy-Exit-IP"

# Confirmed to be recognised. Anything outside this set is refused client-side,
# because the gateway answers an unknown name with 200 and the setting silently
# dropped - the connection succeeds with settings that were never applied, which
# is the one failure that cannot be seen in the rows afterwards.
#
# `speed` was missing until 2026-08-12 and was found by reading the provider's
# own proxy generator rather than by probing: the dashboard offers four IP filter
# modes and builds three of them out of `filter` and `speed` together, while the
# fourth passes neither. A name we do not know is indistinguishable from a name
# the gateway does not know, so the generator was the only place it could surface.
#
# `type` was missing until 2026-08-26 and is the expensive one. It selects mobile
# against residential exits, which is a different pool and not a filter over the
# same one, and no row in data/runs/ can ever have asked for it - strict
# validation refused the name before a request existed. It surfaced by reading
# the vendor's own public SDK at `nodemavencom/proxy`, which neither of ours
# matches, and was then verified two ways rather than assumed from it.
known_params = ["country", "region", "city", "isp", "sid", "ttl", "filter",
                "ipv4", "speed", "type"]

notes = """
Measured 2026-08-10 by raw CONNECT probes. None of this is documented by the
vendor; re-verify before quoting it.

Sticky sessions key on the whole recognised parameter set, not on `sid` alone.
`country=us, sid=A` and `country=us, sid=A, filter=medium` are two different
sessions, `ttl` does not participate and `filter` does. Adding or removing any
parameter silently moves you to another exit.

Seven inputs, seven reactions, none of which names the cause:
  bad country          406 Not Acceptable
  bad region           406 Not Acceptable
  bad city             500 Internal Server Error
  bad filter value     407 Proxy Authentication Required
  bad ttl value        407 Proxy Authentication Required
  empty value          no reply, the connection hangs about 20 s
  unknown parameter    200, the parameter is ignored

The 407 cases are actively misleading - they send the operator to check
credentials. With no `country` the default country is not stable.

Re-probed 2026-08-26 from the VPS to settle which names the gateway knows,
because four sources disagreed: this file, our Python SDK, the vendor's public
SDK at `nodemavencom/proxy`, and the help pages. Acceptance proves nothing here,
so every phase carried a negative control - `zzqqx`, a name nobody implemented -
and a positive one, `filter`, known recognised since 2026-08-10.

  name          junk value   reading
  zzqqx           200        the control: unknown names answer 200 for anything
  filter          407        the control: known names refuse what is not on the list
  type            407        recognised - an unknown name cannot produce this
  speed           407        recognised, confirming the 2026-08-12 generator read
  norotate        200        indistinguishable from the unknown name

`type` selects the network and not merely a label on it. 5 echo requests per arm,
fresh sid each, country=us: `type=mobile` drew AS21928 T-Mobile three times, one
AS6167 - that is Cellco, the wireless side of Verizon, whatever ipinfo labels it -
and one AS7018. `type=residential` and the unset arm drew Comcast, Charter,
Windstream, Metronet, Fidium, Planet and AS701 Verizon wireline, and no mobile
ASN between them. So the parameter moves you to a carrier pool, which is a
different set of addresses rather than a quality filter over the same one.

`filter=high` and `filter=low` both answer 200 and are therefore on the
whitelist, against a junk filter value answering 407. Every run in data/runs/
used `filter=medium` and nothing here has ever measured the other two.

**`ttl` is documented wrong and fails misleadingly.** The help pages give TTL in
seconds; `ttl=60` is refused 407 and `ttl=1m` is accepted. Both SDKs emit
`60s / 1m / 1h / 24h` and they are right. An operator following the documentation
gets a 407 and goes to check credentials that are fine.

**`norotate` is not recognised on this account and this gateway.** Three
independent probes: junk value answers 200 exactly like the unknown name; with no
sid it rotated 6 distinct exits of 6, as did both controls; with a fixed sid and
`ttl=1m` sampled at 0, 78 and 157 seconds it drew 3 distinct of 3, as did both
controls. Our own SDK ships it as a valid parameter, so a user setting it gets a
200 and no rotation change. That is measured against `gate.nodemaven.com:8080` on
one account on 2026-08-26 and does not rule out the name being real on another
product or plan - a name the gateway does not know is invisible by design, so
this is the strongest negative the method can produce and it is not a proof.
"""
